<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />

    <link rel="icon" href="images/icons/paz-baires-logotipo-blanco-2.webp" />
    <link rel="stylesheet" href="css/estilos-comunes.css?v=2.0" />
    <link rel="stylesheet" href="css/tienda.css?v=2.0" />
    <title>Paz Baires</title>

    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xv4faet71w");
    </script>
  </head>
  <body>
    <main class="tienda-main">
      <section class="filters">
        <div class="contenedor-busqueda">
          <input
            type="text"
            id="buscador-input"
            placeholder="¿Qué estás buscando? (ej: funda de sillones, sabanas, pijamas)"
            autocomplete="off"
          />
          <button
            type="button"
            id="limpiar-busqueda-btn"
            class="limpiar-btn hidden"
            aria-label="Limpiar búsqueda"
          >
            ✕
          </button>
          <button
            type="button"
            id="lupa-btn"
            class="lupa-btn"
            aria-label="Buscar"
          >
            <img
              src="images/icons/lupa-icon.webp"
              alt="Buscar"
              loading="lazy"
              decoding="async"
            />
          </button>
        </div>

        <div class="filters-categories">
          <div class="categories">
            <button class="category-btn">BLANQUERÍA</button>
            <button class="category-btn">ACCESORIOS</button>
            <button class="category-btn">PIJAMAS</button>
            <button class="category-btn">MARROQUINERÍA</button>
            <button class="category-btn">PACKS/DOCENAS</button>
            <button class="category-btn">OFERTAS</button>
          </div>
        </div>
      </section>

      <div id="contenedor-tienda" class="grid-productos"></div>
    </main>

    <script src="js/componentes.js?v=2.1"></script>
    <script src="js/productos.js?v=2.1"></script>
    <script src="js/main.js?v=2.1"></script>
    <script src="js/tienda.js?v=2.1"></script>
  </body>
</html>
