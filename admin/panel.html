<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="/images/icons/paz-baires-logotipo-blanco-2.webp" />
    <link rel="stylesheet" href="css/panel.css" />
    <title>Panel de Control - Paz Baires</title>
  </head>
  <body>
    <!-- Barra Superior Administrativa -->
    <header class="admin-header">
      <img
        src="../images/icons/paz-baires-logotipo.webp"
        alt="Paz Baires"
        class="logo-admin"
      />
      <div class="admin-actions">
        <button id="btnNuevoProducto" class="btn-primary">+ Nuevo Producto</button>
        <button id="btnLogout" class="btn-outline">Cerrar Sesión</button>
      </div>
    </header>

    <main class="tienda-main">
      <div class="admin-controls">
        <h1>Gestión de Catálogo</h1>
        <input
          type="text"
          id="buscadorAdmin"
          placeholder="Buscar por nombre o ID..."
        />
      </div>

      <!-- Reutilizamos tu clase de grilla de la tienda -->
      <div id="contenedor-admin" class="grid-productos-fijo">
        <!-- Aquí el JS renderizará las cards con la lógica de tienda-main.css -->
      </div>

      <div id="contenedor-tienda" class="grid-productos">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </main>

    <!-- Modal de Edición (Capa oculta que aparecerá al editar) -->
    <div id="modalEditor" class="modal">
      <!-- Contenido del formulario que haremos luego -->
    </div>

    <script src="js/check-auth.js"></script>
    <script src="js/ui-admin.js"></script>
    <script src="../js/productos.js"></script>
    <script src="js/ui-admin.js"></script>
  </body>
</html>
